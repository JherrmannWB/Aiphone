<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aiphone" />
  <title>Quick Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="quicklog">
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="wrap ql-wrap">
    <header class="page-nav card shell-card">
      <div>
        <div class="eyebrow">Aiphone Training Suite</div>
        <h1 class="page-title">Quick Log</h1>
        <p class="page-copy">Phone stayed in the locker? Fill out the whole workout in a few taps — everything is prefilled from your last session.</p>
      </div>
      <nav class="page-links" aria-label="Primary">
        <a class="page-link" href="index.html">Power Calculator</a>
        <a class="page-link" href="workout.html">Workout Tracker</a>
        <a class="page-link active" href="quicklog.html" aria-current="page">Quick Log</a>
      </nav>
    </header>

    <div id="qlEditor">
      <div class="ql-split-bar" id="qlSplitBar"></div>
      <div class="ql-day-chips" id="qlDayChips"></div>

      <div class="card ql-meta">
        <div class="form-row cols-2">
          <div>
            <label for="qlDate">Date</label>
            <input id="qlDate" type="date" />
          </div>
          <div>
            <label for="qlBodyWt">Bodyweight (optional)</label>
            <input id="qlBodyWt" class="mono" inputmode="decimal" placeholder="205" />
          </div>
        </div>
      </div>

      <div class="ql-list" id="qlList"></div>

      <div class="card ql-add">
        <label for="qlAddSelect">Add another exercise</label>
        <select id="qlAddSelect"></select>
      </div>

      <div class="card ql-notes">
        <label for="qlNotes">Notes (optional)</label>
        <textarea id="qlNotes" placeholder="PRs, pain, anything worth remembering..."></textarea>
      </div>
    </div>

    <div id="qlDone"></div>

    <div class="ql-save-bar" id="qlSaveBar">
      <button class="ghost ql-save-btn" id="qlSaveBtn" type="button">Save Progress</button>
      <button class="success ql-save-btn" id="qlCompleteBtn" type="button">Complete Workout</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
